[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tidewater"
version = "0.1.0.dev0"
description = "ocean-forced frontal ablation for glacier models"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Muhammad Shafeeque" }, { name = "tidewater contributors" }]
keywords = ["glacier", "frontal ablation", "calving", "ocean thermal forcing"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy",
    "pandas",
    "xarray",
    "netCDF4",
    "cftime",
    "scipy",
]

[project.scripts]
tidewater-forcing = "tidewater.forcing.cli:main"

[project.optional-dependencies]
teos10 = ["gsw"]
test = ["pytest"]
plot = ["matplotlib"]
docs = ["sphinx>=7", "myst-parser", "furo"]

[tool.hatch.build.targets.wheel]
packages = ["src/tidewater"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "README.md", "LICENSE", "CITATION.cff"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
