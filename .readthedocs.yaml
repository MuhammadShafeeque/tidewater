version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    # the version is read from the tags, which the default checkout lacks
    post_checkout:
      - git fetch --unshallow --tags || git fetch --tags

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
